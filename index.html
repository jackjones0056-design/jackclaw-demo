<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050506"><title>JackClaw Demo</title><style>:root{--bg:#030405;--text:#f2f4f6;--muted:#858d96;--line:rgba(255,255,255,.09);--red:#ff3326;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text)}#matrix{position:fixed;inset:0;width:100%;height:100%}.vignette{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 180px 55px rgba(0,0,0,.9)}.top{position:fixed;z-index:5;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 14px) 18px}.brand{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;letter-spacing:.22em}.eye{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 16px var(--red)}.meta{font:11px ui-monospace,monospace;color:var(--muted)}.center{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none}.core{position:relative;width:min(78vw,640px);aspect-ratio:1;display:grid;place-items:center;pointer-events:auto}.ring{position:absolute;inset:12%;border:1px solid rgba(255,70,50,.12);border-radius:50%}.ring:after{content:"";position:absolute;inset:12%;border:1px dashed rgba(255,70,50,.12);border-radius:50%;animation:spin 18s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hit{width:52%;height:52%;border-radius:50%;border:0;background:transparent}.statebox{position:absolute;bottom:7%;width:100%;text-align:center}.state{font-size:11px;font-weight:800;letter-spacing:.30em}.sub{margin-top:7px;font:10px ui-monospace,monospace;color:var(--muted);letter-spacing:.12em}.voice{position:fixed;z-index:6;left:50%;top:67%;transform:translateX(-50%);width:min(700px,calc(100% - 32px));text-align:center}.voice-line{font-size:18px;line-height:1.45;opacity:0;transition:.25s}.voice-line.show{opacity:1}.wave{height:18px;margin-top:10px;display:flex;justify-content:center;gap:3px;opacity:0}.wave.on{opacity:1}.wave span{width:2px;background:var(--red);border-radius:2px;animation:pulse .65s ease-in-out infinite alternate}@keyframes pulse{from{height:3px}to{height:18px}}.command{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:8;width:min(760px,calc(100% - 28px))}.inputwrap{position:relative;padding:10px;border:1px solid var(--line);border-radius:18px;background:rgba(10,11,13,.84)}textarea{width:100%;min-height:48px;resize:none;border:0;outline:0;background:transparent;color:#fff;padding:10px 48px 8px 10px;font:16px inherit}.send{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,70,50,.3);background:rgba(150,15,10,.22);color:#fff}.side{position:fixed;z-index:7;top:46%;display:grid;gap:8px}.side.left{left:12px}.side.right{right:12px}.btn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:rgba(10,11,13,.75);color:#9fa6ae;font-size:10px;font-weight:800}.overlay{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:10;display:none}.overlay.show{display:block}.drawer{position:fixed;z-index:11;top:0;bottom:0;width:min(400px,90vw);padding:24px 16px;background:rgba(7,8,10,.97);transition:transform .25s ease}.drawer.left{left:0;transform:translateX(-102%)}.drawer.right{right:0;transform:translateX(102%)}.drawer.open{transform:translateX(0)}.section{margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:15px}.label{font-size:10px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.row{padding:10px 0;font-size:13px}.pill{float:right;font-size:10px}.close{float:right;background:transparent;border:0;color:#aaa;font-size:24px}.tool-node{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 12px rgba(255,60,40,.8);opacity:0}.tool-node.on{opacity:1}@media(max-width:640px){.meta{display:none}.core{width:94vw}.side{top:auto;bottom:92px;display:flex}.voice{top:61%}}</style></head><body><canvas id="matrix"></canvas><div class="vignette"></div><div class="top"><div class="brand"><span class="eye"></span>JACKCLAW</div><div class="meta">CORE ONLINE // DEMO MODE</div></div><div class="center"><div class="core"><div class="ring"></div><div id="orbit" style="position:absolute;inset:0;pointer-events:none"></div><button id="coreHit" class="hit"></button><div class="statebox"><div id="state" class="state">ONLINE</div><div id="sub" class="sub">CORE STABLE // AWAITING INPUT</div></div></div></div><div class="voice"><div id="voiceLine" class="voice-line"></div><div id="wave" class="wave"><span></span><span></span><span></span><span></span><span></span></div></div><div class="side left"><button class="btn" id="opsBtn">OPS</button><button class="btn" data-agent="Research">RSRCH</button><button class="btn" data-agent="Coding">CODE</button></div><div class="side right"><button class="btn" data-agent="Business">BIZ</button><button class="btn" data-agent="Finance">FIN</button><button class="btn" id="sysBtn">SYS</button></div><div class="command"><div class="inputwrap"><textarea id="prompt" placeholder="Type a directive…"></textarea><button id="send" class="send">↑</button></div></div><div id="overlay" class="overlay"></div><aside id="ops" class="drawer left"><button class="close" onclick="closeAll()">×</button><h3>OPERATIONS</h3><div class="section"><div class="label">Active Intelligence</div><div class="row" id="agent">Supervisor</div></div><div class="section"><div class="label">Automations</div><div class="row">Market monitor <span class="pill">ARMED</span></div><div class="row">Business brief <span class="pill">08:00</span></div></div></aside><aside id="sys" class="drawer right"><button class="close" onclick="closeAll()">×</button><h3>SYSTEM CORE</h3><div class="section"><div class="label">Security</div><div class="row">Policy Engine <span class="pill">ENFORCED</span></div><div class="row">Live Finance <span class="pill">CODE-GATED</span></div></div></aside><script>const $=id=>document.getElementById(id),canvas=$('matrix'),ctx=canvas.getContext('2d');let mode='idle',energy=.34,target=.34,t=0,agent='Supervisor',busy=false;const modes={idle:['ONLINE','CORE STABLE // AWAITING INPUT',.34],listening:['LISTENING','VOICE CHANNEL ACTIVE',.72],thinking:['THINKING','INFERENCE CASCADE ACTIVE',.93],executing:['EXECUTING','TOOL CHAIN IN PROGRESS',1],speaking:['RESPONDING','OUTPUT CHANNEL ACTIVE',.78]};function setMode(m){mode=m;let x=modes[m];$('state').textContent=x[0];$('sub').textContent=x[1];target=x[2]}function speak(x){$('voiceLine').textContent=x;$('voiceLine').classList.add('show');$('wave').classList.add('on');setMode('speaking');setTimeout(()=>{$('voiceLine').classList.remove('show');$('wave').classList.remove('on');setMode('idle')},2800)}const nodes=Array.from({length:430},()=>({a:Math.random()*6.28,r:.08+Math.pow(Math.random(),.72)*.92,s:(Math.random()-.5)*.003,z:.3+Math.random()*1.5,p:Math.random()*6.28}));function resize(){let r=canvas.getBoundingClientRect(),d=Math.min(2,devicePixelRatio||1);canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function frame(){t++;energy+=(target-energy)*.045;let r=canvas.getBoundingClientRect(),W=r.width,H=r.height,cx=W/2,cy=H*.46,R=Math.min(W,H)*.29;ctx.fillStyle='#030405';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';for(const n of nodes){n.a+=n.s*(1+energy*3);let rr=R*n.r*(1+Math.sin(t*.025+n.p)*.03*energy),x=cx+Math.cos(n.a)*rr,y=cy+Math.sin(n.a)*rr*.8;ctx.fillStyle='rgba(255,45,25,'+(.15+.5*n.r)+')';ctx.beginPath();ctx.arc(x,y,n.z*(.65+energy*.55),0,6.28);ctx.fill()}ctx.globalCompositeOperation='source-over';requestAnimationFrame(frame)}frame();const orbit=$('orbit'),tools=[];for(let i=0;i<7;i++){let n=document.createElement('div');n.className='tool-node';orbit.appendChild(n);tools.push(n)}function showOrbit(){let b=orbit.getBoundingClientRect(),cx=b.width/2,cy=b.height/2,r=Math.min(b.width,b.height)*.38;tools.forEach((n,i)=>{let a=i/tools.length*6.28-1.57;n.style.left=(cx+Math.cos(a)*r)+'px';n.style.top=(cy+Math.sin(a)*r)+'px';n.classList.add('on')})}function hideOrbit(){tools.forEach(n=>n.classList.remove('on'))}function run(){let q=$('prompt').value.trim();if(!q||busy)return;busy=true;$('prompt').value='';setMode('thinking');setTimeout(()=>{setMode('executing');showOrbit()},700);setTimeout(()=>{hideOrbit();speak(agent==='Finance'?'Risk controls remain enforced. Simulation complete.':agent==='Coding'?'Execution environment prepared. The implementation path is clear.':agent==='Research'?'Evidence isolated. Analysis complete.':'Directive acknowledged. The system is ready.');busy=false},1750)}$('send').onclick=run;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();run()}};$('coreHit').onclick=()=>setMode(mode==='listening'?'idle':'listening');document.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>{agent=b.dataset.agent;$('agent').textContent=agent;speak(agent+' intelligence online.')});function openDrawer(x){$('overlay').classList.add('show');$(x).classList.add('open')}function closeAll(){$('overlay').classList.remove('show');$('ops').classList.remove('open');$('sys').classList.remove('open')}$('opsBtn').onclick=()=>openDrawer('ops');$('sysBtn').onclick=()=>openDrawer('sys');$('overlay').onclick=closeAll;</script></body></html>
